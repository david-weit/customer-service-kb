services:
  app:
    build: .
    stdin_open: true
    tty: true
    env_file: .env
    environment:
      - MILVUS_URI=http://host.docker.internal:19530
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - hf_cache:/app/.cache/huggingface
    command: python main.py

  mcp:
    build: .
    env_file: .env
    environment:
      - MILVUS_URI=http://host.docker.internal:19530
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - hf_cache:/app/.cache/huggingface
    working_dir: /app/mcp-server
    command: python server.py
    profiles:
      - mcp

volumes:
  hf_cache:
